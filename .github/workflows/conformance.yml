name: conformance

# Two jobs doing deliberately different work.
#
#   vectors  offline and deterministic — pins this repository's Merkle
#            implementation to known inputs and outputs. Must always pass; a
#            failure here means we broke ourselves.
#
#   live     hits api.6529.io and checks that the root it publishes reproduces
#            from the entries it serves. A failure here means either they
#            changed the calculation or their API is having a bad day — which
#            is worth knowing either way, and is the reason this runs daily.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 6529 recomputes every identity's TDH at 00:00 UTC. Ask an hour and a half
    # later, once the day's numbers have settled.
    - cron: '30 1 * * *'

permissions:
  contents: read

jobs:
  vectors:
    name: golden vectors (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: php conformance/run-vectors.php

  live:
    name: live check against api.6529.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: php conformance/verify.php
